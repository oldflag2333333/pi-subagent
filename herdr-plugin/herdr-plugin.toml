id = "subagent.agent-visibility"
name = "Pi Subagent Agent Visibility"
version = "0.1.0"
min_herdr_version = "0.8.2"
description = "Hide or show Pi Subagent subs in Herdr's Agents panel"
platforms = ["linux", "macos"]

[[startup]]
command = ["pi", "--offline", "--no-extensions", "-e", "action.ts", "--subagent-visibility-action", "startup", "--list-models"]

[[actions]]
id = "toggle-subs"
title = "Toggle Pi Subagent subs"
contexts = ["global"]
command = ["pi", "--offline", "--no-extensions", "-e", "action.ts", "--subagent-visibility-action", "toggle", "--list-models"]

[[actions]]
id = "hide-subs"
title = "Hide Pi Subagent subs"
contexts = ["global"]
command = ["pi", "--offline", "--no-extensions", "-e", "action.ts", "--subagent-visibility-action", "hide", "--list-models"]

[[actions]]
id = "show-subs"
title = "Show Pi Subagent subs"
contexts = ["global"]
command = ["pi", "--offline", "--no-extensions", "-e", "action.ts", "--subagent-visibility-action", "show", "--list-models"]
